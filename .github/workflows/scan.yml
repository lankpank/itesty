name: Run Server Scanner

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}  # ← USE PAT

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Run scanner
        run: node server_scanner.js
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}  # ← USE PAT
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}

      - name: 📤 Commit and push
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 Auto-update server list [skip ci]"
          file_pattern: "hopper.lua"
          commit_user_name: "lankpank"
          commit_user_email: "lankpank@users.noreply.github.com"
